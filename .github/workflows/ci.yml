name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,docx]"

      - name: Check CLI and web test dependencies
        run: |
          impactnote version
          devfolio --help
          python -c "import fastapi, httpx, docx; from devfolio.web.app import create_app; create_app()"

      - name: Run tests
        run: pytest --cov=impactnote --cov=devfolio --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  portability:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install from clean checkout
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,docx]"
      - name: Run unit and integration tests
        run: pytest -q -p no:cacheprovider --no-cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t impactnote:ci .
      - name: Start without AI keys and check health
        run: |
          docker run -d --name impactnote-ci -p 127.0.0.1:18000:8000 impactnote:ci serve --host 0.0.0.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs impactnote-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f impactnote-ci || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.11

      - name: Lint
        run: ruff check impactnote/ devfolio/ tests/ evals/

      - name: Format check
        run: ruff format --check impactnote/ devfolio/ tests/ evals/
