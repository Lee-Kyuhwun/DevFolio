[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impactnote"
version = "1.0.0"
description = "성과노트(ImpactNote) — 근거 기반 업무 성과 기록 및 보고서 작성 도구"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0,<1.0",
    "ruamel.yaml>=0.18.0,<0.19",
    "jinja2>=3.1.0,<4.0",
    "keyring>=25.0.0,<27.0",
    "rich>=13.7.0,<15.0",
    "pydantic>=2.0.0,<3.0",
    "platformdirs>=4.0.0,<5.0",
]

[project.optional-dependencies]
ai = [
    "litellm>=1.60.0,<3.0",  # 1.60+: Gemini 2.0 Flash 지원
]
pdf = [
    "weasyprint>=62.0",
    "markdown>=3.6",
]
docx = [
    "python-docx>=1.1.0",
]
gui = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
]
all = [
    "litellm>=1.60.0",
    "weasyprint>=62.0",
    "markdown>=3.6",
    "python-docx>=1.1.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0,<1.0",
    "litellm>=1.60.0",
    "markdown>=3.6",
    "ruff==0.15.11",
    "pre-commit>=3.7",
]

[project.scripts]
impactnote = "impactnote.main:cli"
# 레거시 호환: 기존 `devfolio` 명령과 데이터/API 는 그대로 동작한다.
devfolio = "devfolio.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["impactnote*", "devfolio*"]

[tool.setuptools.package-data]
impactnote = ["web/static/*"]
devfolio = ["templates/*.j2", "web/templates/*.html", "web/static/*", "prompts/ko/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=impactnote --cov=devfolio --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
