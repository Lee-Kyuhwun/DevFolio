repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 린트·포맷·테스트를 모두 통과해야 커밋된다 (Claude Code 훅과 같은 스크립트).
  - repo: local
    hooks:
      - id: devfolio-check
        name: devfolio check (ruff + pytest)
        entry: scripts/check.sh
        language: system
        pass_filenames: false
        always_run: true
